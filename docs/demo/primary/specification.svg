<path d="M 310,30 V 222" stroke="black" stroke-width="0.3"/>
<text x="320" y="43.2" text-anchor="middle">Ед.</text>
<text x="320" y="47.2" text-anchor="middle">изме-</text>
<text x="320" y="51.2" text-anchor="middle">рения</text>
<path d="M 330,30 V 222" stroke="black" stroke-width="0.3"/>
<text x="340" y="45.2" text-anchor="middle">Коли-</text>
<text x="340" y="49.2" text-anchor="middle">чество</text>
<path d="M 350,30 V 222" stroke="black" stroke-width="0.3"/>
<text x="362.5" y="45.2" text-anchor="middle">Масса 1</text>
<text x="362.5" y="49.2" text-anchor="middle">ед., кг</text>
<path d="M 375,30 V 222" stroke="black" stroke-width="0.3"/>
<text x="395" y="47.2" text-anchor="middle">Примечание</text>
<path d="M 20,62 H 415" stroke="black" stroke-width="0.3"/>
<g id="spec-row-1">
<text x="30" y="71.65" text-anchor="middle">1</text>
<text x="42" y="71.65" text-anchor="start">Отвод 90° ПЭ 100 SDR 17 ⌀110×6,6</text>



<text x="320" y="71.65" text-anchor="middle">шт.</text>
<text x="340" y="71.65" text-anchor="middle">2</text>

<text x="377" y="67.65" text-anchor="start">Материал и SDR</text>
<text x="377" y="71.65" text-anchor="start">приняты как у</text>
<text x="377" y="75.65" text-anchor="start">трубы</text>
</g>
