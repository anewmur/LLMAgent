<text font-size="3.5"><tspan x="157.0" y="98.0"></tspan></text>
</g>
</g>
  <g id="general-notes"><text font-size="3.5"><tspan x="30" y="152.0">Основанием для разработки является задание на проектирование.</tspan></text>
<text font-size="3.5"><tspan x="30" y="158.5">Система координат условная, единицы — метры. Ось X направлена вправо, ось Y — вверх</tspan><tspan x="30" y="163.0">листа.</tspan></text>
<text font-size="3.5"><tspan x="30" y="169.5">Проектируемая сеть В1 — подземный напорный водопровод из труб ПЭ 100 SDR 17 110×6,6.</tspan><tspan x="30" y="174.0">Длина трассы — 360,00 м.</tspan></text>
<text font-size="3.5"><tspan x="30" y="180.5">Количество трубы равно длине по оси трассы в плане, без запаса и без вычета монтажных</tspan><tspan x="30" y="185.0">длин отводов.</tspan></text>
<text font-size="3.5"><tspan x="30" y="191.5">В исходных данных заданы отметки оси трубопровода; на профиле показаны отметки низа</tspan><tspan x="30" y="196.0">трубы (ось минус половина наружного диаметра). Труба показана сплошной толстой линией.</tspan></text>
<text font-size="3.5"><tspan x="30" y="202.5">Принятые допущения и ограничения приведены в отчёте о проверках.</tspan></text></g>
  <g id="general-assumptions"><g data-assumption-id="coordinate_system"><text font-size="3.5"><tspan x="230" y="194.0">Координаты — м; X вправо, Y вверх.</tspan></text></g>

<g data-assumption-id="network_ground"><text font-size="3.5"><tspan x="230" y="200.5">В1 условно; земля проектная, натурная поверхность не задана.</tspan></text></g>

<g data-assumption-id="bend_material"><text font-size="3.5"><tspan x="230" y="207.0">Материал и SDR отводов — как у трубы.</tspan></text></g>

<g data-assumption-id="profile_insulation"><text font-size="3.5"><tspan x="230" y="213.5">Изоляции нет; основание не задано.</tspan></text></g>

<g data-assumption-id="missing_levels"><text font-size="3.5"><tspan x="230" y="220.0">Пропуски отметок не интерполируются.</tspan></text></g>

<g data-assumption-id="pipe_quantity"><text font-size="3.5"><tspan x="230" y="226.5">Труба по оси трассы: без запаса и вычета отводов.</tspan></text></g>

<text font-size="3.5"><tspan x="230" y="233.0">Полный перечень допущений — в отчёте о проверках.</tspan></text></g>
</g>

</svg>
