<text font-size="3.5"><tspan x="17.0" y="20.0">Общие данные</tspan></text>
<text font-size="3.5"><tspan x="157.0" y="20.0"></tspan></text>
<text font-size="3.5"><tspan x="2.0" y="28.0">2</tspan></text>
<text font-size="3.5"><tspan x="17.0" y="28.0">План сетей водоснабжения</tspan></text>
<text font-size="3.5"><tspan x="157.0" y="28.0"></tspan></text>
<text font-size="3.5"><tspan x="2.0" y="36.0">3</tspan></text>
<text font-size="3.5"><tspan x="17.0" y="36.0">Профиль В1</tspan></text>
<text font-size="3.5"><tspan x="157.0" y="36.0"></tspan></text>
</g>
</g>
  <g transform="translate(30 97)"><g xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" fill="black">
  <rect width="185" height="23" fill="none" stroke="black" stroke-width="0.5"/>
  <path d="M 0,15 H 185 M 0,23 H 185 M 60,0 V 23 M 155,0 V 23" fill="none" stroke="black" stroke-width="0.3"/>
  <text font-size="3.5"><tspan x="2.0" y="8.5">Обозначение</tspan></text>
<text font-size="3.5"><tspan x="62.0" y="8.5">Наименование</tspan></text>
<text font-size="3.5"><tspan x="157.0" y="8.5">Примечание</tspan></text>
<text font-size="3.5"><tspan x="2.0" y="20.0">AI-TEST-01-НВ</tspan></text>
<text font-size="3.5"><tspan x="62.0" y="20.0">Наружные сети водоснабжения</tspan></text>
<text font-size="3.5"><tspan x="157.0" y="20.0"></tspan></text>
</g>
</g>
  <g id="reference-register" transform="translate(230 37)"><g xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans" fill="black">
  <rect width="185" height="103.0" fill="none" stroke="black" stroke-width="0.5"/>
  <path d="M 0,15 H 185 M 0,23 H 185 M 0,35.0 H 185 M 0,47.0 H 185 M 0,59.0 H 185 M 0,67.0 H 185 M 0,75.0 H 185 M 0,83.0 H 185 M 0,91.0 H 185 M 0,103.0 H 185 M 60,0 V 103.0 M 155,0 V 103.0" fill="none" stroke="black" stroke-width="0.3"/>
  <text font-size="3.5"><tspan x="2.0" y="8.5">Обозначение</tspan></text>
<text font-size="3.5"><tspan x="62.0" y="8.5">Наименование</tspan></text>
<text font-size="3.5"><tspan x="157.0" y="8.5">Примечание</tspan></text>
<text font-size="3.5"><tspan x="2.0" y="20.0"></tspan></text>
<text font-size="3.5"><tspan x="62.0" y="20.0">Ссылочные документы</tspan></text><path d="M 62.0,21.0 h 33.25" stroke="black" stroke-width="0.15"/>
<text font-size="3.5"><tspan x="157.0" y="20.0"></tspan></text>
<text font-size="3.5"><tspan x="2.0" y="30.0">ГОСТ Р 21.101-2026</tspan></text>
<text font-size="3.5"><tspan x="62.0" y="27.75">Основные требования к проектной и рабочей</tspan><tspan x="62.0" y="32.25">документации</tspan></text>
<text font-size="3.5"><tspan x="157.0" y="30.0"></tspan></text>
