[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmagent"
version = "0.1.0"
description = "Прототип ИИ-агента выпуска документации подземного водопровода"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "pydantic>=2",
    "python-dotenv",
    "reportlab",
    "svglib>=2.4,<3",
    "pypdf",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
llmagent = "main:main"

[tool.setuptools]
packages = ["agent", "core", "core.checks"]
py-modules = ["main"]

[tool.setuptools.package-data]
agent = ["system_prompt.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
