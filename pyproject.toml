[project]
name = "llmagent"
version = "0.1.0"
description = "Прототип ИИ-агента выпуска документации подземного водопровода"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "pydantic>=2",
    "python-dotenv",
    "reportlab",
    "svglib",
    "pypdf",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["."]
