<g xmlns="http://www.w3.org/2000/svg" id="profile-grid" transform="translate(${left} ${top})"
   font-family="${font_family}" font-size="${font_size}" fill="black">
  <!-- Форма 2 с Изменением 1; дополнительная строка «Пикеты». -->
  <path id="grid-outline" d="M 0,0 H ${width} V ${grid_height} H 0 Z M ${sidebar_width},0 V ${grid_height}"
        fill="none" stroke="black" stroke-width="${grid_line_width}"/>
  <path d="M 0,${bottom_level_row_bottom} H ${width} M 0,${ground_row_bottom} H ${width} M 0,${natural_ground_row_bottom} H ${width} M 0,${pipe_row_bottom} H ${width}
           M 0,${base_row_bottom} H ${width} M 0,${slope_row_bottom} H ${width} M 0,${distance_row_bottom} H ${width} M 0,${point_row_bottom} H ${width}"
        fill="none" stroke="black" stroke-width="${grid_line_width}"/>
  <g id="grid-headings">
    <text data-cell="0 0 ${sidebar_width} ${bottom_level_row_bottom}" x="2" y="4"><tspan x="2">Проектная отметка низа</tspan><tspan x="2" dy="5">трубы или низа лотка</tspan><tspan x="2" dy="5">колодца, м</tspan></text>
    <text data-cell="0 ${bottom_level_row_bottom} ${sidebar_width} ${ground_row_bottom}" x="2" y="21"><tspan x="2">Проектная отметка</tspan><tspan x="2" dy="6">земли, м</tspan></text>
    <text data-cell="0 ${ground_row_bottom} ${sidebar_width} ${natural_ground_row_bottom}" x="2" y="36"><tspan x="2">Натурная отметка</tspan><tspan x="2" dy="6">земли, м</tspan></text>
    <text data-cell="0 ${natural_ground_row_bottom} ${sidebar_width} ${pipe_row_bottom}" x="2" y="52"><tspan x="2">Обозначение трубы</tspan><tspan x="2" dy="6">и тип изоляции</tspan></text>
    <text data-cell="0 ${pipe_row_bottom} ${sidebar_width} ${base_row_bottom}" x="2" y="73">Основание</text>
    <text data-cell="0 ${base_row_bottom} ${sidebar_width} ${slope_row_bottom}" x="2" y="86"><tspan x="2">Уклон, ‰;</tspan><tspan x="2" dy="6">длина, м</tspan></text>
    <text data-cell="0 ${slope_row_bottom} ${sidebar_width} ${distance_row_bottom}" x="2" y="107">Расстояние, м</text>
    <text data-cell="0 ${distance_row_bottom} ${sidebar_width} ${point_row_bottom}" x="2" y="118"><tspan x="2">Номер колодца,</tspan><tspan x="2" dy="6">точки, угла поворота</tspan></text>
    <text data-cell="0 ${point_row_bottom} ${sidebar_width} ${grid_height}" x="2" y="143">Пикеты</text>
  </g>
  ${values}
  ${sections}
  <g font-family="${font_family}" text-anchor="middle" font-size="${font_size}">
    <text data-kind="pipe-description" data-cell="${pipe_cell}" x="${middle}" y="53">${pipe_name}</text>
    <text data-kind="insulation" data-cell="${pipe_cell}" x="${middle}" y="60">${insulation}</text>
  </g>
  ${scale_labels}
</g>
