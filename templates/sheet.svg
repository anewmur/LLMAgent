<svg xmlns="http://www.w3.org/2000/svg"
    width="${sheet_width}mm" height="${sheet_height}mm" viewBox="0 0 ${sheet_width} ${sheet_height}">
  <rect width="${sheet_width}" height="${sheet_height}" fill="white"/>
  <!-- Рамка и контур штампа: толщина линий 0.7 мм по эталону. -->
  <g fill="none" stroke="black" stroke-width="0.7">
    <rect id="frame" x="${frame_left}" y="${frame_top}" width="${frame_width}" height="${frame_height}"/>
    <rect id="title-block" x="${stamp_left}" y="${stamp_top}" width="${stamp_width}" height="${stamp_height}"/>
  </g>

    <g transform="translate(${stamp_left} ${stamp_top})">
    <!-- Толстые внутренние линии штампа. -->
    <g fill="none" stroke="black" stroke-width="0.7">
      <!-- Разделитель левой и правой частей -->
      <path d="M 65,0 V ${stamp_height}"/>
      <!-- Низ блока изменений / верх блока подписей (на всю ширину) -->
      <path d="M 0,25 H ${stamp_width}"/>
      <!-- Верх строки заголовков изменений (только слева) -->
      <path d="M 0,20 H 65"/>
    </g>
    <!-- Тонкие линии сетки. -->
    <g fill="none" stroke="black" stroke-width="0.3">
      <!-- Горизонтали левой части: строки по 5 мм -->
      <path d="M 0,5 H 65 M 0,10 H 65 M 0,15 H 65"/>
      <path d="M 0,30 H 65 M 0,35 H 65 M 0,40 H 65 M 0,45 H 65 M 0,50 H 65"/>
      <!-- Вертикали зоны изменений (y=0..25): 10+10+10+10+15+10 -->
      <path d="M 10,0 V 25 M 20,0 V 25 M 30,0 V 25 M 40,0 V 25 M 55,0 V 25"/>
      <!-- Вертикали блока подписей (y=25..55): 20+20+15+10 -->
      <path d="M 20,25 V ${stamp_height} M 40,25 V ${stamp_height} M 55,25 V ${stamp_height}"/>
      <!-- Правая часть: низ обозначения, низ объекта -->
      <path d="M 65,10 H ${stamp_width}"/>
      <!-- Стадия / Лист / Листов: подписи и значения -->
      <path d="M 135,25 V ${stamp_height} M 150,25 V 40 M 165,25 V 40"/>
      <path d="M 135,30 H ${stamp_width}"/>
      <path d="M 65,40 H ${stamp_width}"/>
    </g>
    <g font-family="${font_family}" fill="black">
      <!-- Правая часть: обозначение, объект, название листа -->
      <g text-anchor="middle">
        <text x="125" y="7" font-size="2.5">${designation}</text>
        <text x="125" y="19.5" font-size="2.5">${object_name}</text>
        <text x="100" y="35.5" font-size="2.5">${title}</text>
        <text x="142.5" y="28.7" font-size="2.5">Стадия</text>
        <text x="142.5" y="36.5" font-size="2.5">Р</text>
        <text x="${sheet_number_x}" y="28.7" font-size="2.5">Лист</text>
        <text x="${sheet_number_x}" y="${sheet_number_y}" font-size="2.5">${number}</text>
        <text x="${sheet_total_x}" y="28.7" font-size="2.5">Листов</text>
        <text x="${sheet_total_x}" y="${sheet_number_y}" font-size="2.5">${total}</text>
      </g>
      <!-- Заголовки граф изменений -->
      <g text-anchor="middle" font-size="2.5">
        <text x="5" y="23.7">Изм.</text>
        <text x="15" y="23.7">Кол.уч.</text>
        <text x="25" y="23.7">Лист</text>
        <text x="35" y="23.7">№ док.</text>
        <text x="47.5" y="23.7">Подп.</text>
        <text x="60" y="23.7">Дата</text>
      </g>
      <!-- Роли в блоке подписей (колонка 20 мм) -->
      <g text-anchor="start" font-size="2.5">
        <text x="1.5" y="28.7">Разраб.</text>
        <text x="1.5" y="33.7">Пров.</text>
        <text x="1.5" y="48.7">Н. контр.</text>
        <text x="1.5" y="53.7">ГИП</text>
      </g>
    </g>
  </g>


  <text x="${training_x}" y="${training_y}" text-anchor="middle"
        font-family="${font_family}" font-size="${training_size}">${training_label}</text>
  <text id="paper-format" x="414" y="295.5" text-anchor="end"
        font-family="${font_family}" font-size="2.5">Формат A3</text>
${body}</svg>
