<g xmlns="http://www.w3.org/2000/svg" id="profile-geometry"
   data-datum-m="${datum}" data-horizontal-scale="${horizontal_scale}" data-vertical-scale="${vertical_scale}"
   data-font-size="${font_size}" font-family="${font_family}" fill="none" stroke="black">
  <path id="ground-line" d="${ground}" stroke-width="0.45"/>
  <path id="pipe-bottom-line" d="${bottom}" stroke-width="${pipe_line_width}"/>
  ${top}
</g>
${reference}
