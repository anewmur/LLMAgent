<g xmlns="http://www.w3.org/2000/svg" id="profile-geometry"
   data-datum-m="${datum}" data-horizontal-scale="2000" data-vertical-scale="100"
   data-font-size="${font_size}" fill="none" stroke="black">
  <path id="ground-line" d="${ground}" stroke-width="0.45"/>
  <path id="pipe-bottom-line" d="${bottom}" stroke-width="1.0"/>
  ${top}
</g>
${reference}
