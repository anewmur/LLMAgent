<g xmlns="http://www.w3.org/2000/svg" id="plan-legend" transform="translate(30 239)"
   font-family="Arial, sans-serif" font-size="3.5" fill="black">
  <!-- В1 принято условно. -->
  <text x="0" y="0" font-size="3.5">Условные обозначения</text>
  <path data-kind="pipe-symbol" d="M 0,10 H 25" fill="none" stroke="black"
        stroke-width="0.7" stroke-dasharray="6 2"/>
