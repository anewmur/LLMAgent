  title: Общие данные
  suffix: -НВ
- id: plan
  title: План сетей водоснабжения (1:1000)
  suffix: -НВ
- id: profile
  title: Профиль В1
  suffix: -НВ
- id: spec
  title: Спецификация оборудования, изделий и материалов
  suffix: -НВ.СО
- id: report
  title: Отчёт о проверках
references:
- designation: ГОСТ Р 21.101-2026
  name: Основные требования к проектной и рабочей документации
- designation: ГОСТ 21.704-2011 (Изм. 1)
  name: Рабочая документация наружных сетей водоснабжения и канализации
- designation: ГОСТ 21.110-2013
  name: Спецификация оборудования, изделий и материалов
- designation: ГОСТ 21.206-2012
  name: Условные обозначения трубопроводов
- designation: ГОСТ 2.303-68
  name: Линии
- designation: ГОСТ 2.304-81
  name: Шрифты чертежные
assumptions:
- Вход — JSON одной подземной напорной сети водоснабжения, с одной однородной трубой на всю трассу. Обозначение
  сети В1 назначено условно.
- Координаты заданы в условной местной системе, в метрах. На плане положительное направление оси X принято
  вправо, оси Y — вверх листа. Ориентация системы относительно сторон света исходными данными не задана.
- Заданная отметка земли принимается проектной. Натурная поверхность, основание и изоляция не заданы.
- Пикетаж считается по накопленной длине трассы в плане от первой точки (ПК 0+00,00); один пикет — 100 м. Сантиметры
  выводятся всегда.
- Количество трубы равно длине по оси трассы в плане, без запаса и без вычета монтажных длин отводов.
- Наружный низ трубы = отметка оси минус половина наружного диаметра; глубина = отметка земли минус отметка
  наружного низа.
- Материал и SDR отводов приняты как у трубы. Угол отвода сверяется с координатами с допуском 0,5°; значения
  90° числом не подписываются.
- Расчёты ведутся без округления; вывод — два знака, ROUND_HALF_UP, десятичная запятая. Координаты и отметки
  — м, диаметр и стенка — мм, уклон — промилле.
- 'Пропущенные отметки не интерполируются: линия прерывается, в числовой графе ставится прочерк. Неизвестные
  графы спецификации пусты.'
- НВ — один документ из общих данных, плана и профиля; СО — отдельный документ. Номера считаются из состава,
  Листов выводится только на первом листе; у однолистовой СО номер пуст.
- Условный горизонт подбирается так, чтобы линии земли и трубы были по высоте в центре поля между верхней рамкой
  и верхней линией таблицы. Его линия совмещена с верхом сетки; отметка может быть дробной.
- Труба на плане штриховая, на профиле — сплошная толстая линия с пояснением в общих данных по допускающему
  абзацу п. 3.9 ГОСТ 21.704 (Изм. 1).
- В графе «Уклон, ‰; длина, м» линия участка проводится из угла в угол клетки и показывает направление уклона.
  Величина уклона указана числом над линией, длина участка — под линией. Фактический угол наклона трубы на
  профиле в графе не воспроизводится, так как при принятых уклонах линия была бы неотличима от горизонтальной
  (ГОСТ 21.704, примечание к таблице профиля). При нулевом уклоне линия горизонтальна и проходит по середине
  клетки.
- Для PDF используются Arial либо комплектный DejaVu Sans. Для знака диаметра — DejaVu Sans; неизменённый шрифт
  и лицензия включены в репозиторий.
- Труба изображается двумя линиями при диаметре в масштабе от 2 мм, иначе одной (ГОСТ 21.704 п. 5.2.3, ГОСТ
  2.303 табл. 2).
- Размеры шрифта — из ряда ГОСТ 2.304 п. 2.2; базовый 3,5 мм, настраивается. Отступ подписей от линий 1,5 мм
  — учебный выбор, нормой не установлен.
- Названия изображений и обозначение трубы — ближайший размер разрешённого ряда, который в 1,5–2 раза больше
  базового. Числа, подписи и названия строк таблицы — базовый размер. Штамп — 2,5 мм.
- В графе уклонов линия показывает направление уклона; величина указана числом.
- Обозначение В1 принято условно (ГОСТ 21.206 п. 3.3), в исходных данных не задано.
- Для учебного профиля принято «Без изоляции». Исходные данные не определяют изоляцию; основание не заполняется.
- Все листы комплекта — A3 альбомный, один шаблон sheet.svg. План — 1:1000; профиль — 1:2000 по горизонтали
  и 1:100 по вертикали (ГОСТ 21.704 табл. 2).
- Формат и масштабы выбраны для исходных трасс 360 и 380 м. Автоподбор формата, масштаба и деление на листы
  не реализованы; при нехватке места выдаётся ошибка.
limitations:
- Отводы включены в спецификацию вопреки ГОСТ 21.704 п. 7.4 — номенклатура задана ТЗ
- 'Таблица спецификации начинается на 25 мм ниже верхней рамки ради учебной надписи: отклонение от рисунка
  формы 1 ГОСТ 21.110.'
- 'Форма 3 упрощена: дополнительные графы подлинника и согласования не воспроизведены полностью. Формат подписан
  под штампом; исполнители, подписи и даты не заполняются.'
- В доступном ГОСТ Р 21.101-2026 рисунок формы 2 расходится с указаниями к заполнению. Для ведомостей ссылок
  и комплектов принят макет 60/95/30 мм. Нужна сверка с поправкой ИУС 11-2026 (3 страницы); её текст не получен,
  влияние на формы не подтверждено.
- Нет генплана, топоплана, окружения и пересечений с другими сетями; соответствие системе координат генплана
  и ориентация по сторонам света не подтверждаются.
- Нет геологии, грунтовых вод, натурной поверхности, основания, изоляции, колодцев и камер; их характеристики
  и изображения не выдумываются.
- 'Нет расходов и напоров: таблица основных показателей сети не заполняется. Гидравлика, прочность, промерзание,
  минимальное покрытие и сортамент диаметра/стенки/SDR не проверяются.'
- Стандарт/ТУ, поставщик, код продукции, масса единицы и организация не заполняются без исходных данных; пропуски
  перечисляются в отчёте.
- Автоматический выбор формата и масштаба, многостраничная спецификация не реализованы. При нехватке места
  выпуск отклоняется.
- Автоматического устранения всех наложений подписей нет; обязательна визуальная проверка нового входа.
- Формальная регистрация изменений, разрешения и подписи не ведутся; при изменении данных выполняется полный
  перевыпуск.
- DXF и отдельная схема напорной сети не выпускаются. Состав ограничен тестовым заданием; полное соответствие
  строительной РД не заявляется.
- Крупный базовый шрифт может не помещаться в фиксированные строки профиля. В этом случае перевыпуск отклоняется
  с объяснением; прежний лист сохраняется.
- При интервале точек профиля менее 8 мм на листе или нехватке поля по ширине и высоте выдаётся ошибка; листы
  не делятся автоматически.
