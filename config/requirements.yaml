documents:
- id: general
  title: Общие данные
  suffix: -НВ
- id: plan
  title: План сетей водоснабжения
  short_title: План
  suffix: -НВ
- id: profile
  title: Профиль {network_code}
  short_title: Профиль
  suffix: -НВ
- id: specification
  title: Спецификация оборудования, изделий и материалов
  short_title: Спецификация
  suffix: -НВ.СО
- id: report
  title: Отчёт о проверках
references:
- designation: ГОСТ Р 21.101-2026
  name: Основные требования к проектной и рабочей документации
- designation: ГОСТ 21.704-2011 (Изм. 1)
  name: Рабочая документация наружных сетей водоснабжения и канализации
- designation: ГОСТ 21.110-2013
  name: Спецификация оборудования, изделий и материалов
- designation: ГОСТ 21.206-2012
  name: Условные обозначения трубопроводов
- designation: ГОСТ 2.303-68
  name: Линии
- designation: ГОСТ 2.304-81
  name: Шрифты чертежные
assumptions:
- id: coordinate_system
  full: Система координат условная, единицы — метры. Ось X направлена вправо, ось Y — вверх листа.
  short: Координаты — м; X вправо, Y вверх.
  key: true
- id: network_ground
  full: '{network_code} назначено условно. Отметка земли принята проектной. Натурная поверхность не задана.'
  short: '{network_code} условно; земля проектная, натурная поверхность не задана.'
  key: true
- id: bend_material
  full: Материал и SDR отводов приняты как у трубы.
  short: Материал и SDR отводов — как у трубы.
  key: true
- id: profile_insulation
  full: Тип изоляции — {insulation}; основание не задано.
  short: "Изоляция: {insulation}; основание не задано."
  key: true
- id: missing_levels
  full: Пропуски отметок не интерполируются.
  short: Пропуски отметок не интерполируются.
  key: true
- id: orientation
  full: Ориентация системы относительно сторон света исходными данными не задана.
  short: Ориентация по сторонам света не задана.
- id: label_overlap
  full: Блоки подписей точек плана сдвигаются по вертикали с выносками, если исходное место занято. Оставшиеся
    пересечения обнаруживаются приближённо по оценке габаритов текста и отмечаются предупреждениями.
  short: Блоки подписей разносятся по вертикали; оставшиеся наложения отмечаются предупреждениями.
- id: point_markers
  full: Вершины трассы без колодцев показаны кружком; отдельного обозначения ГОСТ 21.704-2011 для них не устанавливает
    (п. 3.6, 5.1.2).
  short: Кружки обозначают вершины трассы без колодцев.
- id: input
  full: Вход — JSON одной подземной напорной сети водоснабжения, с одной однородной трубой на всю трассу.
  short: Одна подземная напорная сеть, одна однородная труба.
- id: stations
  full: Пикетаж считается по накопленной длине трассы в плане от первой точки (ПК 0+00,00); один пикет — 100 м.
    Сантиметры выводятся всегда.
  short: Пикет — 100 м; пикетаж от начала, с сантиметрами.
- id: pipe_quantity
  full: Количество трубы равно длине по оси трассы в плане, без запаса и без вычета монтажных длин отводов.
  short: 'Труба по оси трассы: без запаса и вычета отводов.'
  key: true
- id: bottom_levels
  full: Наружный низ трубы = отметка оси минус половина наружного диаметра; глубина = отметка земли минус отметка
    наружного низа.
  short: Низ трубы = ось − радиус; глубина считается до низа.
- id: bend_angles
  full: Угол отвода сверяется с координатами с допуском 0,5°; значения 90° числом не подписываются.
  short: Допуск углов — 0,5°; прямые углы числом не подписываются.
- id: rounding
  full: Расчёты ведутся без округления; вывод — два знака, ROUND_HALF_UP, десятичная запятая. Координаты и отметки
    — м, диаметр и стенка — мм, уклон — промилле. Модуль уклона показывается целым при отклонении не более
    {slope_tolerance} ‰, иначе с одним знаком.
  short: 'Округление только вывода: два знака, ROUND_HALF_UP, запятая.'
- id: missing_values
  full: При пропуске отметки линия прерывается, в числовой графе ставится прочерк. Неизвестные графы спецификации
    пусты.
  short: 'Пропуски: разрыв линии, прочерк или пустая графа.'
- id: documents
  full: НВ — один документ из общих данных, плана и профиля; СО — отдельный документ. Номера считаются из состава,
    Листов выводится только на первом листе; у однолистовой СО номер пуст.
  short: 'НВ: общие данные, план, профиль; СО нумеруется отдельно.'
- id: datum
  full: Условный горизонт выбран так, чтобы самый низкий низ трубы был на {profile_gap} мм выше таблицы.
    Высота графика не центрируется; выход подписей за поле отмечается предупреждением.
  short: Низ трубы прижат к таблице с зазором {profile_gap} мм.
- id: pipe_style
  full: '{line_description}'
  short: '{line_description}'
- id: slope_cell
  full: В графе «Уклон, ‰; длина, м» линия участка проводится из угла в угол клетки и показывает направление уклона.
    Величина уклона указана числом над линией, длина участка — под линией. Фактический угол наклона трубы на профиле
    в графе не воспроизводится, так как при принятых уклонах линия была бы неотличима от горизонтальной (ГОСТ 21.704,
    примечание к таблице профиля). При нулевом уклоне линия горизонтальна и проходит по середине клетки.
  short: 'В графе уклонов: направление линией, уклон и длина числами.'
- id: font_family
  full: Для всего комплекта используется DejaVu Sans из assets/fonts; неизменённый шрифт и лицензия включены в репозиторий.
  short: Шрифт DejaVu Sans, лицензия в репозитории.
- id: pipe_contours
  full: На плане и профиле труба изображается двумя линиями при диаметре в масштабе от {profile_two_line_threshold_mm}
    мм, иначе одной (ГОСТ 21.206-2012 п. 3.5, ГОСТ 2.303 табл. 2).
  short: Два контура при диаметре от {profile_two_line_threshold_mm} мм на листе.
- id: font_sizes
  full: Размеры шрифта — из ряда ГОСТ 2.304 п. 2.2; базовый 3,5 мм, настраивается. Отступ подписей от линий 1,5
    мм — учебный выбор, нормой не установлен.
  short: Шрифты по ГОСТ 2.304; отступ 1,5 мм — учебный выбор.
- id: title_fonts
  full: Названия изображений и обозначение трубы — ближайший размер разрешённого ряда, который в 1,5–2 раза больше
    базового. Числа, подписи и названия строк таблицы — базовый размер. Штамп — 2,5 мм.
  short: Названия в 1,5–2 раза крупнее; штамп — 2,5 мм.
- id: network_basis
  full: Основание условного обозначения сети — ГОСТ 21.206 п. 3.3.
  short: Обозначение сети — по ГОСТ 21.206, п. 3.3.
- id: sheet_format
  full: Все листы комплекта — A3 альбомный, один шаблон sheet.svg. Масштаб плана и горизонтальный масштаб профиля выбираются из стандартных рядов;
    вертикальный масштаб задаётся параметром. Масштабы указаны на листах (ГОСТ 21.704 табл. 2).
  short: Все листы — A3; масштабы в плане подбираются по полю листа.
- id: fit
  full: Масштабы плана и профиля по горизонтали выбираются из стандартных рядов по доступному полю. Автоподбор формата
    и деление на листы не реализованы; при нехватке ширины выдаётся ошибка.
  short: Масштабы в плане по полю; автоподбора формата и деления на листы нет.
- id: pipe_note
  full: 'Труба ⌀{diameter} при 1:{vertical_scale} = {on_paper} мм {comparison} {profile_two_line_threshold_mm} мм;
    число линий: {pipe_lines} (п. 3.5 ГОСТ 21.206-2012).'
  short: Труба ⌀{diameter} на профиле — {pipe_lines_text}
- id: bend_radius
  plan_lines: 2
  full: Радиус отвода принят равным {bend_radius_factor} наружного диаметра трубы; в исходных данных радиус не задан.
  short: Радиус отвода — {bend_radius_factor} наружного диаметра; радиус не задан.
  key: true
- id: bend_marker
  plan_lines: 2
  key: true
  full: При изображении в две линии точка поворота показана на оси отвода (в середине дуги); координаты в подписи — вершина угла поворота трассы.
  short: Маркер поворота — середина дуги оси; координаты — вершина угла трассы.
- id: symbolic_bends
  plan_lines: 1
  full: Отводы при изображении трубопровода одной линией показаны условно — углом (ГОСТ 21.206-2012, табл. 1, п.
    8в).
  short: Условные отводы одной линией показаны углом.
  key: true
limitations:
- Отводы включены в спецификацию вопреки ГОСТ 21.704 п. 7.4 — номенклатура задана ТЗ
- 'Таблица спецификации начинается на 25 мм ниже верхней рамки ради учебной надписи: отклонение от рисунка формы
  1 ГОСТ 21.110.'
- 'Форма 3 упрощена: дополнительные графы подлинника и согласования не воспроизведены полностью. Формат подписан
  под штампом; исполнители, подписи и даты не заполняются.'
- В доступном ГОСТ Р 21.101-2026 рисунок формы 2 расходится с указаниями к заполнению. Для ведомостей ссылок и комплектов
  принят макет 60/95/30 мм. Нужна сверка с поправкой ИУС 11-2026 (3 страницы); её текст не получен, влияние на формы
  не подтверждено.
- Нет генплана, топоплана, окружения и пересечений с другими сетями; соответствие системе координат генплана и ориентация
  по сторонам света не подтверждаются.
- Нет геологии, грунтовых вод, натурной поверхности, основания, изоляции, колодцев и камер; их характеристики и
  изображения не выдумываются.
- 'Нет расходов и напоров: таблица основных показателей сети не заполняется. Гидравлика, прочность, промерзание,
  минимальное покрытие и сортамент диаметра/стенки/SDR не проверяются.'
- Стандарт/ТУ, поставщик, код продукции, масса единицы и организация не заполняются без исходных данных; пропуски
  перечисляются в отчёте.
- Автоматический выбор формата и многостраничная спецификация не реализованы. При нехватке места выпуск
  отклоняется.
- Автоматического устранения всех наложений подписей нет; обязательна визуальная проверка нового входа.
- Формальная регистрация изменений, разрешения и подписи не ведутся; при изменении данных выполняется полный перевыпуск.
- DXF и отдельная схема напорной сети не выпускаются. Состав ограничен тестовым заданием; полное соответствие строительной
  РД не заявляется.
- Крупный базовый шрифт может не помещаться в фиксированные строки профиля. В этом случае перевыпуск отклоняется
  с объяснением в отчёте об отказе; прежний комплект удаляется.
- Интервалы точек профиля менее 8 мм на листе дают предупреждение о тесных подписях. Нехватка поля по ширине остаётся ошибкой;
  выход графика и подписей за поле по высоте даёт предупреждение. Листы не делятся автоматически.
missing_data:
  common:
  - Не заданы организация, исполнители, подписи и даты в основной надписи.
  - Не заданы поставщик, код продукции и масса единицы в спецификации.
  - Не заданы натурная поверхность, основание, геология и УГВ.
  pipe_standard: Не задан стандарт или ТУ на трубу; графа документа оставлена пустой.
  bend_standard: Документ на отводы не задан.
general_notes:
- Основанием для разработки является задание на проектирование.
- '{coordinate_system}'
- Проектируемая сеть {network_code} — подземный напорный водопровод из труб {pipe}. Длина трассы — {length} м.
- '{pipe_quantity}'
- В исходных данных заданы отметки оси трубопровода; на профиле показаны отметки низа трубы (ось минус половина
  наружного диаметра). {pipe_style}
pipe_lines_text:
  1: одной линией
  2: двумя линиями
assumptions_footer: Полный перечень допущений и ограничений — в отчёте о проверках.

profile:
  default_insulation: Без изоляции
  pipe_description: "Труба {material} ⌀{diameter}×{wall}{standard}"
  materials:
    Сталь:
      description: стальная
    ПЭ:
      description: "полиэтиленовая {material} SDR {sdr}"
    ПП:
      description: "полипропиленовая {material} SDR {sdr}"
    default:
      description: "{material}"

axis_notes:
  true: Ось — тонкая штрихпунктирная.
  false: ""

drawing_line_notes:
  template: 'На плане труба показана {plan}; на профиле — {profile}. {axis}'
  dashed: одной штриховой толстой линией
  solid: одной сплошной толстой линией
  double: двумя сплошными толстыми линиями
