meta:
  version: '3'
  date: '2026-11-03'
  description: Онтология агента выпуска РД наружной сети водоснабжения (комплект НВ)
  editions:
  - ГОСТ 21.704-2011 (изд. 2013) + Изменение № 1 (ИУС № 3-2017, в РФ с 01.07.2017)
  - Поправка 2025 к ГОСТ 21.704-2011 — только список государств, на требования не влияет
  - ГОСТ Р 21.101-2026 (приказ № 129-ст от 12.02.2026, взамен ГОСТ Р 21.101-2020)
  - Поправка 2026 к ГОСТ Р 21.101-2026 — текст недоступен (исправляет опечатки), не учтена
  - ГОСТ 21.110-2013 с поправкой (ИУС № 7-2015, на требования не влияет)
  - ГОСТ 21.206-2012
  labels:
    ОБЯЗ.: обязательно; невыполнение — ошибка
    РЕК.: рекомендация; невыполнение — предупреждение
    ДОП.: разрешение; не ошибка, если не применено; если применено — проверить условие
entities:
- name: Сеть (система) В…
  description: Наружная сеть водоснабжения с буквенно-цифровым обозначением (например, В1, В2) по ГОСТ 21.205
  gost: 21.704 п. 3.5, 3.10; 21.206 п. 3.1, 3.3
- name: Участок трубопровода
  description: 'Прямолинейный отрезок сети между двумя точками трассы. Свойства: длина, уклон, диаметр, отметки концов'
  gost: 21.704 п. 3.8, 5.2.4
- name: Точка трассы
  description: 'Характерная точка (P0–P5): начало и конец, точка разрыва или присоединения (марка Т), угол поворота (марка УП). Свойства: координаты, отметки'
  gost: 21.704 п. 3.6 табл. 1, 5.2.5
- name: Угол поворота (УП)
  description: Точка изменения направления трассы. Значение в градусах; на плане не подписывают, если угол 90°
  gost: 21.704 п. 3.6, 3.8, 5.1.2
- name: Колодец / камера
  description: Сооружение на сети. Имеет номер (без марки) или марку (ПГ). Нумерация от источника или границы проектирования
  gost: 21.704 п. 3.6, 5.1.2
- name: Труба / материал
  description: Изделие с наружным диаметром и толщиной стенки (⌀110×6,6), материалом ПЭ100 SDR17 и документом-стандартом
  gost: 21.704 п. 3.11; 21.206 п. 3.11; 21.110 п. 4.7
- name: Фасонная часть (отвод)
  description: Элемент трубопровода (отвод, тройник, переход, крестовина). УГО по 21.206 табл. 1. В спецификацию может не включаться (21.704 п. 7.4)
  gost: 21.206 табл. 1 п. 8; 21.704 п. 7.4, 7.5
- name: Основной комплект НВ
  description: Основной комплект рабочих чертежей марки НВ (наружные сети водоснабжения)
  gost: 21.704 п. 3.3, 3.4; 21.101 табл. В.1
- name: Общие данные
  description: 'Первые листы комплекта: ведомости, условные обозначения, общие указания, основные показатели сети'
  gost: 21.101 п. 4.3; 21.704 разд. 4
- name: План сетей
  description: Чертёж трассы в плане на подоснове генплана или топоплана
  gost: 21.704 п. 5.1
- name: Продольный профиль
  description: Развёртка по оси трубопровода с поверхностью земли, трубой и сооружениями
  gost: 21.704 п. 5.2
- name: Сетка (таблица) профиля
  description: Таблица под профилем, боковик по форме 2 (подземная прокладка)
  gost: 21.704 п. 5.2.4 (Изм. №1)
- name: Схема напорной сети
  description: 'Схема без масштаба: трубопроводы, длины, диаметры, фасонные части, упоры, колодцы'
  gost: 21.704 п. 5.3
- name: Спецификация СО
  description: Прилагаемый текстовый документ по форме 1 ГОСТ 21.110 с шифром «СО»
  gost: 21.110; 21.704 разд. 7 (Изм. №1)
- name: Позиция спецификации
  description: 'Строка спецификации: поз., наименование и техническая характеристика, тип/марка/документ, код, поставщик, ед. изм., кол., масса, примечание'
  gost: 21.110 п. 4.7
- name: Лист
  description: Единица графического или текстового документа с основной надписью, форматом по ГОСТ 2.301 и номером
  gost: 21.101 п. 5.2
- name: Основная надпись
  description: 'Штамп листа (формы 3–6) с графами: обозначение, наименования, стадия, лист/листов, подписи, таблица изменений'
  gost: 21.101 п. 5.2, прил. Е
- name: Обозначение документа
  description: Базовое обозначение + «-НВ» (комплект), «.СО» (спецификация), «.Н1» (эскиз)
  gost: 21.101 п. 4.2.4, 4.2.7; 21.110 п. 4.10
- name: Ведомость
  description: Ведомость рабочих чертежей (форма 1), ведомость ссылочных и прилагаемых документов (форма 2)
  gost: 21.101 п. 4.3, прил. Б
- name: Изменение / ревизия
  description: Пронумерованное изменение документа (Изм. 1, 2…) или новая версия ДЭ. Отражается в основной надписи и в ведомостях
  gost: 21.101 разд. 7
- name: Разрешение на изменение
  description: Основание для внесения изменения (формы 9, 9а). Для ДЭ при наличии контроля версий может не оформляться
  gost: 21.101 п. 7.2
- name: Система координат и высот
  description: Принятая в генплане система, которой должна соответствовать сеть
  gost: 21.704 п. 3.8 (Изм. №1); 21.101 п. 4.3.5
relations:
- Комплект НВ состоит из общих данных, планов, профилей, схем напорных сетей (21.704 п. 3.4). Спецификация СО прилагается к комплекту и записывается в ведомость ссылочных и прилагаемых документов (21.110 п. 4.13; 21.101 п. 4.2.6).
- Сеть состоит из участков. Участок ограничен двумя точками трассы (УП, Т, колодец) и выполнен из трубы.
- В точке УП установлен отвод (фасонная часть).
- План и профиль изображают одну и ту же сеть. Длины, расстояния и номера точек на них должны совпадать (сквозная проверка, следует из 21.101 п. 7.1.4).
- Сетка профиля агрегирует данные участков и точек.
- Позиция спецификации ссылается на трубу или изделие. Количество трубы в м = сумма длин участков (контроль 360 м).
- Каждый лист имеет основную надпись. Основная надпись содержит обозначение документа и таблицу изменений.
- Изменение входных данных (например, перенос P5) → изменение всех взаимосвязанных документов (21.101 п. 7.1.4) → новые записи в ведомостях (21.101 п. 7.5.2).
requirements:
- id: REQ-001
  source: ГОСТ 21.704-2011 п. 3.8
  rule: '[ОБЯЗ.] Длины трубопроводов, расстояния между колодцами, точками разрыва и УП, отметки высот указаны в метрах с 2 знаками после запятой. Диаметры и толщины стенок указаны в мм. Углы поворота указаны в градусах с точностью до 1′ (до 1″ при необходимости). Уклон указан в % или ‰'
  data_source: План, сетка профиля, схема напорной сети
- id: REQ-002
  source: ГОСТ 21.704-2011 п. 3.8 (Изм. №1)
  rule: '[ОБЯЗ.] Система координат и высотных отметок сети соответствует системе, принятой в рабочих чертежах генплана'
  data_source: 'План, общие данные (общие указания). Источник нужно уточнить: во входе нет данных о системе генплана'
- id: REQ-003
  source: ГОСТ 21.704-2011 п. 3.14, табл. 2 (Изм. №1)
  rule: '[РЕК.] Масштабы: план сетей 1:500/1:1000/1:2000/1:5000; профиль по горизонтали 1:200/1:500/1:1000/1:2000/1:5000 (1:200 добавлен Изм. №1), по вертикали 1:100/1:200/1:500; схема напорной сети без масштаба'
  data_source: Основная надпись (графа 4 формы 3), подписи на листах
- id: REQ-004
  source: ГОСТ 21.704-2011 п. 3.14
  rule: '[ОБЯЗ.] Масштаб указан в графе 4 основной надписи по форме 3 ГОСТ 21.101. Если на листе несколько изображений в разных масштабах, масштаб указан в скобках у наименования каждого. Сверено с ГОСТ Р 21.101-2026: в форме 3 (прил. Е) отдельной графы «Масштаб» нет, графа 4 — наименование изображений, масштаб пишут в скобках после наименования (п. 5.1.6). Графа 25 «Масштаб» есть только в форме 4 (чертежи строительных изделий) и к нашим листам не относится'
  data_source: Основная надпись плана и профиля
- id: REQ-005
  source: ГОСТ 21.704-2011 п. 3.14
  rule: '[ОБЯЗ.] Масштабы профиля по горизонтали и вертикали указаны слева от профиля, над боковиком таблицы'
  data_source: Профиль
- id: REQ-006
  source: ГОСТ 21.704-2011 п. 5.1.2
  rule: '[ОБЯЗ.] На плане указаны: здания, сооружения и сети, влияющие на прокладку; координаты сети или привязки к осям или базисам; значения углов поворота (кроме углов 90°); диаметры трубопроводов до и после точек их изменения; сооружения на сети с обозначениями или нумерацией'
  data_source: 'План; координаты P0–P5 берём из входных данных трассы. Существующие здания и сети: источник нужно уточнить'
- id: REQ-007
  source: ГОСТ 21.704-2011 п. 5.2.4, форма 2 (Изм. №1)
  rule: '[ОБЯЗ.] Боковик сетки при подземной прокладке содержит строки в порядке: «Проектная отметка низа трубы или низа лотка колодца, м»; «Проектная отметка земли, м»; «Натурная отметка земли, м»; «Обозначение трубы и тип изоляции»; «Основание»; «Уклон, ‰; длина, м»; «Расстояние, м»; «Номер колодца, точки, угла поворота»'
  data_source: 'Профиль; значения из входных данных трассы. «Основание», натурные отметки земли и тип изоляции: источник нужно уточнить'
- id: REQ-008
  source: ГОСТ 21.704-2011 п. 3.2
  rule: '[ОБЯЗ.] Состав РД сети: основной комплект рабочих чертежей; спецификация оборудования, изделий и материалов по ГОСТ 21.110; локальная смета (при необходимости)'
  data_source: Состав выпуска (общие данные, ведомости)
- id: REQ-009
  source: ГОСТ 21.704-2011 п. 3.3
  rule: '[ДОП.] Комплект НВК при необходимости может быть разделён на НВ и НК. Для нашей сети (только водоснабжение) марка комплекта НВ'
  data_source: Основная надпись (обозначение), общие данные
- id: REQ-010
  source: ГОСТ 21.704-2011 п. 3.4
  rule: '[ОБЯЗ.] В комплект НВ включены общие данные, чертежи (планы, профили) сетей и схемы напорных сетей (последние допускается заменить по п. 5.3.5, см. REQ-040)'
  data_source: Ведомость рабочих чертежей
- id: REQ-011
  source: ГОСТ 21.704-2011 п. 3.5, 3.10
  rule: '[ОБЯЗ.] Сети присвоено буквенно-цифровое обозначение по ГОСТ 21.205 (например, В1), и оно нанесено на чертежах по ГОСТ 21.206'
  data_source: 'План, профиль, схема. Номер сети (В1/В2): источник нужно уточнить'
- id: REQ-012
  source: ГОСТ 21.704-2011 п. 3.6, табл. 1 (Изм. №1)
  rule: '[РЕК.] («как правило») Элементы сети обозначены маркой и порядковым номером: УП — угол поворота, Т — точка разрыва или присоединения без колодца, ПГ, Д, Н (неподвижная опора, только надземные)'
  data_source: План, сетка профиля (строка «Номер колодца, точки, угла поворота»), входные данные трассы
- id: REQ-013
  source: ГОСТ 21.704-2011 п. 3.6
  rule: '[ОБЯЗ.] Колодцам и камерам, не указанным в табл. 1, присвоены порядковые номера без марок. Нумерация элементов начинается от источника водоснабжения или границы проектирования'
  data_source: 'План, профиль. Что является источником (P0?): источник нужно уточнить'
- id: REQ-014
  source: ГОСТ 21.704-2011 п. 3.9 (Изм. №1)
  rule: '[ОБЯЗ.] Условные обозначения способов прокладки на плане приняты по ГОСТ 21.204 (табл. 5). Трубопроводы и элементы показаны УГО по ГОСТ 21.206. Невидимые (подземные) показаны штриховой толстой линией'
  data_source: План, профиль
- id: REQ-015
  source: ГОСТ 21.704-2011 п. 3.9 (Изм. №1)
  rule: '[ДОП.] Подземный трубопровод допускается показывать сплошной толстой линией, если на чертежах нет видимых участков. Условие: есть пояснение в общих данных или на чертежах'
  data_source: План; общие данные (общие указания)
- id: REQ-016
  source: ГОСТ 21.704-2011 п. 3.9 (Изм. №1)
  rule: '[ОБЯЗ.] Существующие и проектируемые здания и сооружения, существующие сети и сети другого назначения, влияющие на прокладку, показаны сплошной тонкой линией'
  data_source: 'План. Наличие таких объектов: источник нужно уточнить'
- id: REQ-017
  source: ГОСТ 21.704-2011 п. 3.11
  rule: '[ОБЯЗ.] Если указаны наружный диаметр и толщина стенки, перед числом стоит знак «⌀» (⌀110×6,6). Номинальный диаметр трубопровода указан со знаком «⌀» (допускается «DN»), номинальный диаметр арматуры — с «DN»'
  data_source: План, профиль, схема
- id: REQ-018
  source: ГОСТ 21.704-2011 п. 3.13
  rule: '[ОБЯЗ.] Грунты на профиле обозначены по ГОСТ 21.302'
  data_source: 'Профиль. Источник нужно уточнить: геологии во входе нет'
- id: REQ-019
  source: ГОСТ 21.704-2011 п. 3.15
  rule: '[ДОП.] План или профиль допускается делить на участки на отдельных листах. Если поделены: на каждом листе есть схема целого изображения с номерами листов и штриховкой текущего участка, а участок назван с привязкой к пикетам'
  data_source: План, профиль (если более 1 листа)
- id: REQ-020
  source: ГОСТ 21.704-2011 п. 4.1
  rule: '[ОБЯЗ.] Общие данные дополнительно содержат основные показатели сети; ситуационный план — при необходимости'
  data_source: Общие данные
- id: REQ-021
  source: ГОСТ 21.704-2011 п. 4.2
  rule: '[ОБЯЗ.] Ведомость спецификаций в общих данных комплекта НВ не выполняют'
  data_source: Общие данные
- id: REQ-022
  source: ГОСТ 21.704-2011 п. 4.3
  rule: '[ОБЯЗ.] (если выполняется) Ситуационный план выполнен без масштаба, проектируемый участок выделен толстой основной линией'
  data_source: Общие данные
- id: REQ-023
  source: ГОСТ 21.704-2011 п. 4.4, форма 1
  rule: '[ОБЯЗ.] Таблица основных показателей по форме 1: наименование сети; расчётный расход воды, м³/сут, м³/ч, л/с; примечание'
  data_source: 'Общие данные. Расходы: источник нужно уточнить'
- id: REQ-024
  source: ГОСТ 21.704-2011 п. 4.5
  rule: '[ОБЯЗ.] Общие указания дополнительно содержат: ссылки на нормативы расчёта сети; инженерно-геологическую характеристику; особые требования к сети; требования к изготовлению, монтажу, испытанию, антикоррозионной защите и тепловой изоляции'
  data_source: 'Общие данные. Содержание (геология, испытания): источник нужно уточнить'
- id: REQ-025
  source: ГОСТ 21.704-2011 п. 4.5
  rule: '[РЕК.] («не следует») В общих указаниях не повторяются требования с других листов и нет описания технических решений'
  data_source: Общие данные
- id: REQ-026
  source: ГОСТ 21.704-2011 п. 5.1.1
  rule: '[ОБЯЗ.] Подоснова плана (генплан или топоплан) выполнена тонкой основной линией'
  data_source: 'План. Подоснова: источник нужно уточнить'
- id: REQ-027
  source: ГОСТ 21.704-2011 п. 5.1.2
  rule: '[ОБЯЗ.] (при необходимости, для магистральных сетей) Номера пикетов ПК и привязки элементов к ближайшим пикетам'
  data_source: План, входные данные трассы (пикетаж по X)
- id: REQ-028
  source: ГОСТ 21.704-2011 п. 5.1.4
  rule: '[ДОП.] Вместо плана допускается выполнять фрагменты плана под соответствующими профилями'
  data_source: Профиль, план
- id: REQ-029
  source: ГОСТ 21.704-2011 п. 5.1.5
  rule: '[ОБЯЗ.] Наименование плана: «План сетей», а при раздельном выполнении — «План сетей водоснабжения»'
  data_source: План (наименование), основная надпись, ведомость
- id: REQ-030
  source: ГОСТ 21.704-2011 п. 5.2.1, 5.2.2
  rule: '[ОБЯЗ.] Профиль выполнен как развёртка по оси трубопровода. Над профилем указана глубина заложения: для напорных — от планировочной поверхности земли до низа трубопровода; указаны надземные сооружения (если есть)'
  data_source: Профиль; входные данные трассы (отметки земли и трубы)
- id: REQ-031
  source: ГОСТ 21.704-2011 п. 5.2.3
  rule: '[ОБЯЗ.] На профиле: проектная поверхность земли — тонкой сплошной линией, натурная — тонкой штриховой; УГВ — тонкой штрихпунктирной; пересекаемые дороги и сети с габаритами и отметками; данные о грунтах; проектируемый трубопровод и колодцы; футляры с диаметрами, длинами и привязками'
  data_source: 'Профиль. УГВ, грунты, пересечения: источник нужно уточнить'
- id: REQ-032
  source: ГОСТ 21.704-2011 п. 5.2.3
  rule: '[ОБЯЗ.] (условие) Трубопровод изображён двумя линиями, если его диаметр в масштабе ≥ 2 мм (110 мм при верт. 1:100 = 1,1 мм → одна линия)'
  data_source: Профиль, масштаб
- id: REQ-033
  source: ГОСТ 21.704-2011 п. 5.2.4, примечание
  rule: '[ОБЯЗ.] В строке «Уклон, ‰; длина, м» участок показан линией с наклоном, как на профиле; над линией уклон, под линией длина'
  data_source: Сетка профиля
- id: REQ-034
  source: ГОСТ 21.704-2011 п. 5.2.4
  rule: '[ДОП.] Сетку допускается дополнять строками (пикеты, развёрнутый план трассы, схема сети, характеристики грунтов) и шкалой отметок'
  data_source: Сетка профиля
- id: REQ-035
  source: ГОСТ 21.704-2011 п. 5.2.5
  rule: '[ОБЯЗ.] Отметки проставлены в характерных точках (P0–P5, УП) и в местах пересечений с дорогами и коммуникациями'
  data_source: Профиль, входные данные трассы
- id: REQ-036
  source: ГОСТ 21.704-2011 п. 5.2.6
  rule: '[ОБЯЗ.] Наименование профиля содержит обозначение сети, например «Профиль В1»'
  data_source: Профиль, основная надпись
- id: REQ-037
  source: ГОСТ 21.704-2011 п. 5.3.1
  rule: '[ОБЯЗ.] Схема напорной сети выполнена в плане без масштаба. [ДОП.] Допускается в масштабе плана или в изометрии по ГОСТ 2.317'
  data_source: Схема напорной сети
- id: REQ-038
  source: ГОСТ 21.704-2011 п. 5.3.2 (Изм. №1)
  rule: '[ОБЯЗ.] На схеме: трубопроводы и длины участков; диаметры (толщины стенок при необходимости); фасонные части (отводы), арматура, упоры, опуски труб; колодцы с размерами и привязкой осей труб к стенкам; позиционные обозначения'
  data_source: 'Схема; входные данные трассы (длины, отводы). Упоры, колодцы: источник нужно уточнить'
- id: REQ-039
  source: ГОСТ 21.704-2011 п. 5.3.3
  rule: '[ОБЯЗ.] На схеме трубопроводы показаны очень толстой линией (в 1,5–2 раза толще основной), элементы — УГО, колодцы — тонкой линией упрощённо'
  data_source: Схема
- id: REQ-040
  source: ГОСТ 21.704-2011 п. 5.3.5
  rule: '[ДОП.] Чертежи напорной сети допускается выполнять без схемы. Условие: обязательно выполнены схемы колодцев с привязкой осей труб'
  data_source: 'Комплект (ведомость). Наличие колодцев: источник нужно уточнить'
- id: REQ-041
  source: ГОСТ 21.704-2011 п. 5.3.6
  rule: '[ОБЯЗ.] Наименование схемы: в основной надписи полное («Схема сети В1»), над схемой краткое («В1»)'
  data_source: Схема, основная надпись
- id: REQ-042
  source: ГОСТ 21.704-2011 п. 7.1 (Изм. №1)
  rule: '[ОБЯЗ.] Спецификация составлена по ГОСТ 21.110'
  data_source: Спецификация
- id: REQ-043
  source: ГОСТ 21.704-2011 п. 7.2
  rule: '[ОБЯЗ.] (для комплекта НВК) Разделы «Наружные сети водоснабжения» и «…канализации» — заголовками в графе «Наименование и техническая характеристика», подчёркнуты. Для НВ — одна сеть'
  data_source: Спецификация
- id: REQ-044
  source: ГОСТ 21.704-2011 п. 7.3
  rule: '[ОБЯЗ.] Порядок групп для каждой сети: оборудование → элементы сооружений → арматура → другие изделия → закладные конструкции → трубопроводы → теплоизоляционные конструкции → материалы. Трубопроводы записаны по каждому диаметру; внутри групп — по возрастанию параметров'
  data_source: Спецификация
- id: REQ-045
  source: ГОСТ 21.704-2011 п. 7.4
  rule: '[ОБЯЗ.] Не включены изделия (отводы, переходы, тройники, фланцы, крепёж, прокладки) и материалы, номенклатуру и количество которых определяет монтажная организация. Условие исключения — номенклатуру и количество определяет строительно-монтажная организация; то же правило есть в ГОСТ 21.110 п. 4.6 (REQ-092). Решение проекта: наши 2 отвода 90° определены проектом и включаются в спецификацию (PC-03)'
  data_source: Спецификация, входные данные трассы
- id: REQ-046
  source: ГОСТ 21.704-2011 п. 7.5
  rule: '[ОБЯЗ.] Единицы: оборудование и изделия — шт.; трубопроводы — м; фасонные части — шт.; изоляционные материалы — м³; покрытия и защита — м²; прочие — кг или т'
  data_source: Спецификация (графа «Ед. измерения»)
- id: REQ-047
  source: ГОСТ 21.704-2011 п. 7.6 (Изм. №1)
  rule: '[ОБЯЗ.] Спецификация — отдельный документ с обозначением «<обозначение комплекта>.СО» (например, 2345-12-НВ.СО); старый шифр «С» заменён'
  data_source: Основная надпись спецификации, ведомость прилагаемых документов
- id: REQ-048
  source: ГОСТ 21.110-2013 п. 4.1
  rule: '[ОБЯЗ.] Спецификация составлена по форме 1 к основному комплекту (НВ). [ДОП.] Допускается добавлять графы и менять их размеры (кроме основной надписи) по стандарту организации; допускается не печатать горизонтальные линии между строками (интервал ≥ 1 разряда)'
  data_source: Спецификация
- id: REQ-049
  source: ГОСТ 21.110-2013 п. 4.2
  rule: '[ОБЯЗ.] Спецификация в электронном виде содержит все данные, нужные для вывода на экран или бумагу по стандарту'
  data_source: Спецификация (файл)
- id: REQ-050
  source: ГОСТ 21.110-2013 п. 4.3
  rule: '[ОБЯЗ.] В спецификацию включено всё оборудование, изделия и материалы, предусмотренные чертежами комплекта (сверка с планом, профилем и схемой), с учётом исключения по п. 4.6 (REQ-092). В т. ч. 2 отвода 90° (PC-03)'
  data_source: Спецификация vs план/профиль/схема
- id: REQ-051
  source: ГОСТ 21.110-2013 п. 4.5
  rule: '[РЕК.] («как правило») Спецификация составлена по разделам; внутри разделов — по группам, внутри групп — по возрастанию основных параметров. [ОБЯЗ.] Заголовки разделов записаны в графе «Наименование и техническая характеристика» симметрично и отделены 1–2 строками. [ДОП.] Заголовок допускается не подчёркивать'
  data_source: Спецификация
- id: REQ-052
  source: ГОСТ 21.110-2013 п. 4.7
  rule: '[ОБЯЗ.] Графы формы 1: «Поз.», «Наименование и техническая характеристика», «Тип, марка, обозначение документа, опросного листа», «Код продукции», «Поставщик», «Ед. измерения», «Кол.», «Масса 1 ед., кг», «Примечание»'
  data_source: Спецификация
- id: REQ-053
  source: ГОСТ 21.110-2013 п. 4.7
  rule: '[ОБЯЗ.] В графе «Наименование…» указаны наименование и техническая характеристика по стандарту или ТУ, условное обозначение материала и порядковый номер записи (как правило, в пределах раздела). [ДОП.] В электронном виде горизонтальную черту в обозначении трубы допускается заменять на «/». Пример: «Труба ПЭ100 SDR17 110×6,6 питьевая»'
  data_source: Спецификация; входные данные трассы (материал)
- id: REQ-054
  source: ГОСТ 21.110-2013 п. 4.7
  rule: '[ОБЯЗ.] В графе «Тип, марка, обозначение документа» — обозначение стандарта или ТУ (для трубы ПЭ — например, ГОСТ 18599; конкретный документ: источник нужно уточнить). «Код продукции» не заполняют, если кода нет в документах на продукцию. «Поставщик» — изготовитель или поставщик: источник нужно уточнить'
  data_source: Спецификация
- id: REQ-055
  source: ГОСТ 21.110-2013 п. 4.7
  rule: '[ОБЯЗ.] «Ед. измерения» — обозначение единицы; «Кол.» — количество (труба: сумма длин участков, контроль 360 м). «Масса 1 ед., кг» — масса единицы. [ДОП.] Для изделий до 25 кг, не требующих подъёмных средств, массу допускается не указывать'
  data_source: Спецификация; входные данные трассы (длины)
- id: REQ-056
  source: ГОСТ 21.110-2013 п. 4.10
  rule: '[ОБЯЗ.] Обозначение спецификации = обозначение комплекта по ГОСТ 21.101 + «.СО»'
  data_source: Основная надпись спецификации
- id: REQ-057
  source: ГОСТ 21.110-2013 п. 4.11
  rule: '[ОБЯЗ.] Первый лист — титульный (форма 15 ГОСТ 21.101 по сноске; соответствие нумерации форм в 21.101-2026 не сверялось — неактуально для проекта по решению PC-04), А4. Основные надписи: заглавный лист — форма 5, последующие — форма 6. [ДОП.] Титульный лист допускается не выполнять, тогда первый лист — с основной надписью по форме 3 (так же ГОСТ Р 21.101-2026 п. 5.2.3: последующие — по форме 6). Применяется в проекте (PC-04)'
  data_source: Спецификация (основные надписи)
- id: REQ-058
  source: ГОСТ 21.110-2013 п. 4.12
  rule: '[ОБЯЗ.] На титульном листе наименование с указанием комплекта: «Спецификация оборудования, изделий и материалов наружных сетей водоснабжения». [ДОП.] В основной надписи заглавного листа допускается сокращённо: «Спецификация оборудования, изделий и материалов»'
  data_source: Спецификация
- id: REQ-059
  source: ГОСТ 21.110-2013 п. 4.13
  rule: '[ОБЯЗ.] Спецификация записана в разделе «Прилагаемые документы» ведомости ссылочных и прилагаемых документов общих данных'
  data_source: Общие данные
- id: REQ-060
  source: ГОСТ Р 21.101-2026 п. 4.2.4, табл. В.1
  rule: '[ОБЯЗ.] Обозначение комплекта = базовое обозначение + «-» + марка «НВ». Нумерация листов комплекта, оформленного единым документом, сквозная. Для наружных коммуникаций номер сооружения в базовом обозначении исключают или заменяют нулями (сноска к 4.2.5)'
  data_source: 'Основная надпись (графа 1), ведомость. Базовое обозначение (шифр): источник нужно уточнить'
- id: REQ-061
  source: ГОСТ Р 21.101-2026 п. 4.2.5
  rule: '[ДОП.] Комплект допускается оформлять отдельными документами (обозначение + «.1», «.2»…). Тогда нумерация листов сквозная в пределах каждого документа, общие данные — первый документ (п. 4.3.1)'
  data_source: Основная надпись, ведомость документов
- id: REQ-062
  source: ГОСТ Р 21.101-2026 п. 4.2.6, 4.2.7
  rule: '[ОБЯЗ.] Спецификация отнесена к прилагаемым документам и обозначена «<комплект>.СО»'
  data_source: Общие данные (ведомость ссылочных и прилагаемых документов)
- id: REQ-063
  source: ГОСТ Р 21.101-2026 п. 4.3.1
  rule: '[ОБЯЗ.] Общие данные на первых листах содержат (в общем случае): ведомость рабочих чертежей (форма 1); ведомость ссылочных и прилагаемых документов (форма 2); условные обозначения, не установленные стандартами; общие указания. Над каждым элементом есть заголовок, элементы не нумеруются, расположены сверху вниз, слева направо в указанном порядке'
  data_source: Общие данные
- id: REQ-064
  source: ГОСТ Р 21.101-2026 п. 4.3.1
  rule: '[ОБЯЗ.] Спецификация СО, выполненная самостоятельным документом, не включена в ведомость спецификаций (согласуется с REQ-021)'
  data_source: Общие данные
- id: REQ-065
  source: ГОСТ Р 21.101-2026 п. 4.3.2, прил. Б п. Б.2
  rule: '[ОБЯЗ.] Ведомость рабочих чертежей — последовательный перечень листов: «Лист» — номер; «Наименование» — как в основной надписи листа; «Примечание» — сведения об изменениях'
  data_source: Общие данные vs основные надписи листов
- id: REQ-066
  source: ГОСТ Р 21.101-2026 п. 4.3.3, прил. Б п. Б.7
  rule: '[ОБЯЗ.] Ведомость ссылочных и прилагаемых документов имеет разделы «Ссылочные документы» и «Прилагаемые документы» (заголовки подчёркнуты). Наименование документа совпадает с титульным листом или основной надписью'
  data_source: Общие данные
- id: REQ-067
  source: ГОСТ Р 21.101-2026 п. 4.3.5
  rule: '[ОБЯЗ.] Общие указания содержат: документы-основания (задание на проектирование); запись о соответствии РД заданию, ТУ и нормам; перечень нормативных документов, на которые даны ссылки; принятую систему высот и геодезических координат; перечень скрытых работ для актов освидетельствования; другие указания. Пункты пронумерованы сквозной нумерацией, каждый с абзаца'
  data_source: 'Общие данные. Основания, система координат: источник нужно уточнить'
- id: REQ-068
  source: ГОСТ Р 21.101-2026 п. 5.1.6
  rule: '[ОБЯЗ.] Масштабы на чертежах не указывают, кроме случаев, предусмотренных стандартами СПДС (для сетей — ГОСТ 21.704 п. 3.14, REQ-004/005); тогда масштаб указывают в скобках после наименования изображения. Для формы 3 это графа 4 (наименование изображения + масштаб в скобках)'
  data_source: План, профиль, основная надпись (графа 4)
- id: REQ-069
  source: ГОСТ Р 21.101-2026 п. 5.2.1
  rule: '[РЕК.] («как правило») Каждый лист оформлен основной надписью и дополнительными графами. [ОБЯЗ.] Основная надпись — в правом нижнем углу. На А4 — вдоль короткой стороны (для табличных документов, как правило, вдоль длинной)'
  data_source: Все листы
- id: REQ-070
  source: ГОСТ Р 21.101-2026 п. 5.2.2, 5.2.3
  rule: '[ОБЯЗ.] Основная надпись листов комплекта (план, профиль, схема, общие данные) — по форме 3. Спецификация без титульного листа: первый лист — по форме 3, последующие — по форме 6'
  data_source: Все листы
- id: REQ-071
  source: ГОСТ Р 21.101-2026 прил. Е (указания к формам 3–6)
  rule: '[ОБЯЗ.] Графы основной надписи: 1 — обозначение документа; 4 — наименование изображений на листе (на общих данных — «Общие данные»); 6 — «Р» (рабочая документация); 7 — номер листа (не заполняют для однолистовых); 8 — общее количество листов (только на первом листе); 11–13 — фамилии, подписи, даты; 26 — формат по ГОСТ 2.301 (в форме 3 графа 26 «Формат» есть). Графы 24 «Масса» и 25 «Масштаб» есть только в форме 4, на наших листах (форма 3) их нет'
  data_source: 'Основная надпись. Организация, исполнители, заказчик: источник нужно уточнить'
- id: REQ-072
  source: ГОСТ Р 21.101-2026 прил. Е
  rule: '[ОБЯЗ.] Подписи разработчика и нормоконтролёра обязательны; подпись ГИП обязательна на листах общих данных. В ДЭ подписи выполняются ЭП'
  data_source: 'Основная надпись. Источник нужно уточнить (прототип: поля-заглушки)'
- id: REQ-073
  source: ГОСТ Р 21.101-2026 п. 5.4.1
  rule: '[ОБЯЗ.] Линейные размеры на чертежах наружных сетей указаны без единиц, в метрах с 2 знаками, через запятую. [ДОП.] Точка допускается, если САПР не может вывести «,»'
  data_source: План, профиль
- id: REQ-074
  source: ГОСТ Р 21.101-2026 п. 5.4.3
  rule: '[ОБЯЗ.] Отметки в метрах без единиц. Общее правило — 3 знака «за исключением случаев, оговорённых в соответствующих стандартах СПДС». Для сетей действует ГОСТ 21.704 п. 3.8 — 2 знака (REQ-001); принято в project_context (PC-01). На чертежах наружных сетей абсолютные отметки выше нуля указаны без «+»'
  data_source: Профиль, план
- id: REQ-075
  source: ГОСТ Р 21.101-2026 п. 5.4.4
  rule: '[ДОП.] Уклон допускается указывать в промилле или десятичной дробью до третьего знака. [ОБЯЗ.] На разрезах и схемах перед числом уклона ставят знак «⌐» острым углом в сторону уклона'
  data_source: Сетка профиля, схема
- id: REQ-076
  source: ГОСТ Р 21.101-2026 п. 7.1.2, 7.1.3
  rule: '[ОБЯЗ.] Изменение документа, переданного заказчику, вносится без изменения его обозначения. Если изменение неприемлемо, выпускается новый документ с новым обозначением, а прежнее сохраняется'
  data_source: Журнал изменений агента, основные надписи
- id: REQ-077
  source: ГОСТ Р 21.101-2026 п. 7.1.4
  rule: '[ОБЯЗ.] Изменение, затрагивающее другие документы, сопровождается изменением всех взаимосвязанных документов (перенос P5 → план, профиль, схема, спецификация, общие данные)'
  data_source: Журнал изменений, сравнение ревизий
- id: REQ-078
  source: ГОСТ Р 21.101-2026 п. 7.1.6, 7.3.11
  rule: '[ОБЯЗ.] Факт изменения указан в основной надписи и/или таблице регистрации изменений, в реквизитной части ДЭ, в графе «Примечание» ведомостей. В новой версии ДЭ — данные только о последнем изменении'
  data_source: Основная надпись, общие данные
- id: REQ-079
  source: ГОСТ Р 21.101-2026 п. 7.2.1, 7.2.5
  rule: '[ОБЯЗ.] Изменение вносится на основании разрешения (формы 9, 9а). [ДОП.] Для ДЭ разрешение допускается не оформлять, если САПР/СЭД ведёт версии и контролирует доступ'
  data_source: Журнал изменений. Источник нужно уточнить (политика прототипа)
- id: REQ-080
  source: ГОСТ Р 21.101-2026 п. 7.3.1, 7.3.2, 7.3.7
  rule: '[ОБЯЗ.] Изменения обозначены порядковыми номерами 1, 2, 3…; один номер — на все изменения по одному разрешению. Изменение ДЭ — это новая версия документа. [ДОП.] Допускаются буквенно-цифровые коды версий по стандарту организации; изменённые участки допускается отмечать «|» слева'
  data_source: Основная надпись, журнал изменений
- id: REQ-081
  source: ГОСТ Р 21.101-2026 п. 7.3.10, 7.3.13
  rule: '[ОБЯЗ.] При изменении количества листов исправлена графа «Листов». В таблице изменений: «Изм.» — номер; «Кол. уч.» — число участков (при замене — прочерк); «Лист» — «Зам.»/«Нов.» (при автоматизированном способе на каждом листе — «Зам.»); «№ док.» — обозначение разрешения; «Подп.», «Дата»'
  data_source: Основная надпись (графы 14–19)
- id: REQ-082
  source: ГОСТ Р 21.101-2026 п. 7.5.2, 7.4.4
  rule: '[ОБЯЗ.] В графе «Примечание» ведомости рабочих чертежей у изменённых листов указано «Изм. 1», «Изм. 1; 2», «(Зам.)», «(Нов.)», «(Аннул.)»'
  data_source: Общие данные
- id: REQ-083
  source: ГОСТ Р 21.101-2026 п. 7.5.4
  rule: '[ОБЯЗ.] Если комплект оформлен единым документом, номер изменения присваивается всему комплекту. Если отдельными документами — только изменённому документу и «Общим данным»'
  data_source: Основные надписи, ведомость
- id: REQ-084
  source: ГОСТ Р 21.101-2026 п. 7.5.5
  rule: '[ОБЯЗ.] Изменения в прилагаемых документах (спецификации СО) не отражаются в комплекте, информация передаётся заказчику отдельно. При добавлении или аннулировании прилагаемого документа исправляется ведомость ссылочных и прилагаемых документов с номером изменения в «Примечании»'
  data_source: Спецификация, общие данные, журнал изменений
- id: REQ-085
  source: ГОСТ 21.206-2012 п. 3.1, 3.3
  rule: '[ОБЯЗ.] Условное обозначение трубопровода = УГО (или упрощённое изображение) + буквенно-цифровое обозначение сети (В1) по ГОСТ 21.205'
  data_source: План, профиль, схема
- id: REQ-086
  source: ГОСТ 21.206-2012 п. 3.2, табл. 1
  rule: '[ОБЯЗ.] УГО трубопровода и фасонных частей (отвод, тройник, переход, крестовина — «в соответствии с действительной конфигурацией») приняты по табл. 1'
  data_source: Схема напорной сети, план
- id: REQ-087
  source: ГОСТ 21.206-2012 п. 3.4, 3.5
  rule: '[ОБЯЗ.] На схемах трубопроводы показаны одной линией. На чертежах — двумя линиями, если диаметр в масштабе ≥ 2 мм. [ДОП.] Две линии без осевой или осевая на коротком участке'
  data_source: Схема, план, профиль
- id: REQ-088
  source: ГОСТ 21.206-2012 п. 3.7
  rule: '[ОБЯЗ.] Видимые проектируемые трубопроводы — сплошная толстая основная линия по ГОСТ 2.303, невидимые — штриховая той же толщины. Существующие — тонкие (сплошная или штриховая). [ДОП.] Другие типы линий по стандартам СПДС (ср. REQ-015)'
  data_source: План, профиль
- id: REQ-089
  source: ГОСТ 21.206-2012 п. 3.8, 3.9
  rule: '[ОБЯЗ.] Обозначение «В1» нанесено на полке линии-выноски, над линией или в разрыве линии (для изображения в одну линию); для двухлинейного — на полке или над изображением'
  data_source: План, схема
- id: REQ-090
  source: ГОСТ 21.206-2012 п. 3.10
  rule: '[ОБЯЗ.] Количество обозначений на линиях минимальное, но достаточное для понимания'
  data_source: План, схема
- id: REQ-091
  source: ГОСТ 21.206-2012 п. 3.11
  rule: '[ОБЯЗ.] Диаметры — в мм без единиц, на полке или над изображением: наружный диаметр × стенка со знаком «⌀» (⌀110×6,6); номинальный — «⌀» или «DN»; элементы трубопровода — «DN»'
  data_source: План, профиль, схема
- id: REQ-092
  source: ГОСТ 21.110-2013 п. 4.6
  rule: '[ОБЯЗ.] Не включены «отдельные виды изделий и материалы, номенклатуру и количество которых определяет строительно-монтажная организация, исходя из действующих технологических и производственных норм». Условие: только если номенклатуру и количество определяет монтажная организация. Аналог — ГОСТ 21.704 п. 7.4 (REQ-045), противоречия нет. Наши отводы определены проектом → включены (PC-03)'
  data_source: Спецификация, входные данные трассы
